name: Candidate browser validation (no deployment)
on:
  push:
    branches: [codex/defend-candidate-20261028]
permissions:
  contents: read
concurrency:
  group: defend-candidate-browser-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node scripts/checks/modules.mjs
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Alert routing and short-tone evidence
        timeout-minutes: 12
        run: node scripts/checks/v2321testtone.mjs
      - name: Story debug save lifecycle evidence
        timeout-minutes: 22
        run: node scripts/checks/story-lifecycle.mjs
      - name: Save dedicated screenshots (not visual acceptance)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: defend-candidate-specialist-${{ github.sha }}
          path: shots/
          if-no-files-found: warn
          retention-days: 14
